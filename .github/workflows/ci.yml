name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The MySQL store tests (docs/database.md) run against this; elsewhere
    # they skip without MASOI_MYSQL_DSN.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: masoi-test
          MYSQL_DATABASE: masoi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pmasoi-test --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MASOI_MYSQL_DSN: root:masoi-test@tcp(127.0.0.1:3306)/masoi_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Fast steps first: a format or vet error turns the run red before the slow tests.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: v1.64.8
      - name: make test
        run: make test
